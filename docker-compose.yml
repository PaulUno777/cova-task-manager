services:
  mysql:
    image: mysql:9.7
    container_name: cova-task-manager-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: cova_task_manager
      MYSQL_USER: cova
      MYSQL_PASSWORD: cova
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: