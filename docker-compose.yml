services:
  mysql:
    image: mysql:9.7
    container_name: cova-task-manager-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: cova_task_manager
      MYSQL_USER: cova
      MYSQL_PASSWORD: cova
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: cova-task-manager-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/cova_task_manager
      DB_USERNAME: cova
      DB_PASSWORD: cova
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-this-before-production-1234567890}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: cova-task-manager-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:8080"

volumes:
  mysql_data:
